<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodbye :(</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* Dark Theme Styling */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Source Code Pro', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-weight: 400;
            font-size: 1.5rem;
            color: #777;
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }

        /* Displays everything in a single, aligned horizontal row */
        .countdown-row {
            display: flex;
            align-items: flex-start; /* Aligns the tops of numbers and colons */
            justify-content: center;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .number {
            font-size: 3.5rem;
            font-weight: 600;
            color: #a2e8bc; /* Soft minimal green */
            text-shadow: 0 0 8px rgba(162, 232, 188, 0.15);
            line-height: 1;
        }

        .label {
            font-size: 0.75rem;
            color: #555;
            text-transform: uppercase;
            margin-top: 0.7rem;
            letter-spacing: 1px;
        }

        /* Colons are styled to perfectly match the alignment and size of the numbers */
        .separator {
            font-size: 3.5rem;
            font-weight: 600;
            color: #333;
            line-height: 0.95; /* Slight adjustment to vertically center the colon dots with the numbers */
            padding: 0 0.5rem;
            user-select: none;
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .number, .separator {
                font-size: 2.2rem;
            }
            .separator {
                padding: 0 0.2rem;
            }
            .label {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <h1>Goodbye :(</h1>

    <div class="countdown-row">
        <div class="time-box">
            <span class="number" id="days">00</span>
            <span class="label">Days</span>
        </div>
        <div class="separator">:</div>
        
        <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="label">Hours</span>
        </div>
        <div class="separator">:</div>
        
        <div class="time-box">
            <span class="number" id="minutes">00</span>
            <span class="label">Mins</span>
        </div>
        <div class="separator">:</div>
        
        <div class="time-box">
            <span class="number" id="seconds">00</span>
            <span class="label">Secs</span>
        </div>
    </div>

    <script>
        // Target Date in Brisbane Time (AEST is UTC+10)
        // September 1st, 2026 at 00:00:00 Brisbane time
        const targetDate = new Date(Date.UTC(2026, 8, 1, 0, 0, 0) - (10 * 60 * 60 * 1000));

        function updateCountdown() {
            const now = new Date();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.querySelector('.countdown-row').innerHTML = "<div class='number'>00:00:00:00</div>";
                clearInterval(intervalId);
                return;
            }

            // Math conversions for total days down to seconds
            const seconds = Math.floor((difference / 1000) % 60);
            const minutes = Math.floor((difference / 1000 / 60) % 60);
            const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));

            // Pad numbers with leading zeros
            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        // Run immediately on load, then update every second
        updateCountdown();
        const intervalId = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
