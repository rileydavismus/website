<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodbye :(</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* Dark Theme & Layout Setup */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: 'Source Code Pro', monospace;
        }

        /* Canvas falls underneath the content layer */
        #rainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Foreground interface container */
        .content-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-weight: 400;
            font-size: 1.5rem;
            color: #777;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            user-select: none;
        }

        /* Aligns numbers and colons horizontally */
        .countdown-row {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .number {
            font-size: 3.5rem;
            font-weight: 600;
            color: #a2e8bc; /* Soft minimal green */
            text-shadow: 0 0 8px rgba(162, 232, 188, 0.15);
            line-height: 1;
            padding: 0 0.75rem; 
        }

        .label {
            font-size: 0.75rem;
            color: #555;
            text-transform: uppercase;
            margin-top: 0.7rem;
            letter-spacing: 1px;
            user-select: none;
        }

        .separator {
            font-size: 3.5rem;
            font-weight: 600;
            color: #333;
            line-height: 0.95; 
            user-select: none;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .number {
                font-size: 2.2rem;
                padding: 0 0.4rem; 
            }
            .separator {
                font-size: 2.2rem;
            }
            .label {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="rainCanvas"></canvas>

    <div class="content-container">
        <h1>Goodbye :(</h1>

        <div class="countdown-row">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="separator">:</div>
            
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="separator">:</div>
            
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Mins</span>
            </div>
            <div class="separator">:</div>
            
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Secs</span>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Target Countdown Logic (Brisbane Time Lock - UTC+10) ---
        const targetDate = new Date(Date.UTC(2026, 8, 1, 0, 0, 0) - (10 * 60 * 60 * 1000));

        function updateCountdown() {
            const now = new Date();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.querySelector('.countdown-row').innerHTML = "<div class='number'>00:00:00:00</div>";
                clearInterval(countdownInterval);
                return;
            }

            const seconds = Math.floor((difference / 1000) % 60);
            const minutes = Math.floor((difference / 1000 / 60) % 60);
            const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        const countdownInterval = setInterval(updateCountdown, 1000);


        // --- 2. Brighter Rain Animation Logic ---
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const maxDrops = 120; 
        const raindrops = [];

        for (let i = 0; i < maxDrops; i++) {
            raindrops.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                velocity: Math.random() * 4 + 4, 
                length: Math.random() * 15 + 10  
            });
        }

        function animateRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Increased opacity here from 0.06 to 0.25 for higher visibility
            ctx.strokeStyle = 'rgba(162, 232, 188, 0.25)';
            ctx.lineWidth = 1;
            ctx.lineCap = 'round';

            for (let i = 0; i < maxDrops; i++) {
                let drop = raindrops[i];
                
                ctx.beginPath();
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x, drop.y + drop.length);
                ctx.stroke();

                drop.y += drop.velocity;

                if (drop.y > canvas.height) {
                    drop.y = -drop.length;
                    drop.x = Math.random() * canvas.width;
                    drop.velocity = Math.random() * 4 + 4;
                }
            }
            requestAnimationFrame(animateRain);
        }

        animateRain();
    </script>
</body>
</html>
