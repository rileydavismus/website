<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>minimal blackjack</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Source Code Pro', monospace;
            background-color: #2d6a4f;
            color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-transform: lowercase;
        }

        h1 { margin-top: 20px; font-size: 1.5rem; letter-spacing: 2px; }

        .game-area {
            width: 700px;
            max-width: 95%;
            text-align: center;
            position: relative;
            margin-top: 20px;
        }

        .hand-container {
            min-height: 100px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Deck positioned to the side */
        .deck-area {
            position: absolute;
            top: 20px;
            right: 0;
            text-align: center;
            font-size: 0.8rem;
        }

        .card {
            display: inline-block;
            background: #ffffff;
            width: 60px;
            height: 85px;
            line-height: 85px;
            border-radius: 6px;
            margin: 0 5px;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            text-align: center;
            vertical-align: middle;
            position: relative;
        }

        .card.red { color: #d90429; }
        .card.black { color: #2b2d42; }
        .card.hidden { 
            background: #8d99ae; 
            color: transparent; 
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.15) 5px, rgba(0,0,0,0.15) 10px);
        }

        /* Dealing animation */
        .card.animating {
            animation: dealCard 0.4s ease-out forwards;
        }

        @keyframes dealCard {
            0% { transform: translate(var(--startX), var(--startY)) scale(0.5); opacity: 0; }
            100% { transform: translate(0, 0) scale(1); opacity: 1; }
        }

        .controls { margin-top: 30px; }
        
        .bankroll {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            display: inline-block;
            padding: 8px 15px;
            border-radius: 4px;
        }

        /* Chips display */
        .chip-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            height: 50px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 4px dashed #ffffff;
            background: #d90429;
            color: white;
            font-weight: bold;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-size: 0.9rem;
        }

        /* Splitting Layout */
        #player-hands-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .player-hand-wrapper {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .player-hand-wrapper.active-hand {
            border-color: #ffb703;
            background: rgba(255, 183, 3, 0.1);
        }

        input[type="number"] {
            font-family: 'Source Code Pro', monospace;
            padding: 10px;
            width: 80px;
            text-align: center;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            outline: none;
            background: #f8f9fa;
        }

        button {
            font-family: 'Source Code Pro', monospace;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            background: #1b4332;
            color: white;
            border: 2px solid #1b4332;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.2s;
            text-transform: lowercase;
        }

        button:hover:not(:disabled) { background: #40916c; border-color: #40916c; }
        button:disabled { background: #444; border-color: #444; cursor: not-allowed; color: #888; }
        
        #message {
            height: 24px;
            margin: 15px 0;
            font-weight: bold;
            color: #ffb703;
        }
    </style>
</head>
<body>

    <h1>blackjack pays 3:2</h1>
    
    <div class="bankroll">balance: $<span id="money">1000</span></div>

    <div class="game-area">
        <div class="deck-area">
            <div id="deck-visual" class="card hidden"></div>
            <div>deck</div>
        </div>

        <div>dealer: <span id="dealer-score">?</span></div>
        <div class="hand-container" id="dealer-hand"></div>

        <div class="chip-display" id="chip-area" style="visibility: hidden;">
            <span>total bet:</span>
            <div class="chip" id="chip-amount"></div>
        </div>

        <!-- Player hands wrapper supports splitting -->
        <div id="player-hands-wrapper">
            <div class="player-hand-wrapper" id="wrapper-hand-1">
                <div>player: <span id="player-score-1">0</span></div>
                <div class="hand-container" id="player-hand-1"></div>
            </div>
            
            <div class="player-hand-wrapper" id="wrapper-hand-2" style="display: none;">
                <div>hand 2: <span id="player-score-2">0</span></div>
                <div class="hand-container" id="player-hand-2"></div>
            </div>
        </div>

        <div id="message">place your bet to start!</div>

        <div class="controls">
            <span id="betting-area">
                <input type="number" id="bet-amount" value="50" min="1" step="1">
                <button id="btn-deal">deal</button>
            </span>
            <span id="playing-area" style="display: none;">
                <button id="btn-hit">hit</button>
                <button id="btn-stand">stand</button>
                <button id="btn-double">double</button>
                <button id="btn-split">split</button>
            </span>
        </div>
    </div>

    <script>
        const suits = ['♠', '♥', '♦', '♣'];
        const values = ['2', '3', '4', '5', '6', '7', '8', '9', '10', 'j', 'q', 'k', 'a'];
        
        let deck = [];
        let dealerHand = [];
        let playerHands = [[]];
        let bets = [];
        let activeHand = 0;
        
        let money = 1000;
        let gameActive = false;
        let isDealing = false;

        const uiMoney = document.getElementById('money');
        const uiDealerHand = document.getElementById('dealer-hand');
        const uiDealerScore = document.getElementById('dealer-score');
        const uiMessage = document.getElementById('message');
        const betInput = document.getElementById('bet-amount');
        const deckVisual = document.getElementById('deck-visual');
        const chipArea = document.getElementById('chip-area');
        const chipAmount = document.getElementById('chip-amount');
        
        const uiHandContainers = [
            document.getElementById('player-hand-1'),
            document.getElementById('player-hand-2')
        ];
        const uiScoreDisplays = [
            document.getElementById('player-score-1'),
            document.getElementById('player-score-2')
        ];
        const uiWrappers = [
            document.getElementById('wrapper-hand-1'),
            document.getElementById('wrapper-hand-2')
        ];
        
        const btnDeal = document.getElementById('btn-deal');
        const btnHit = document.getElementById('btn-hit');
        const btnStand = document.getElementById('btn-stand');
        const btnDouble = document.getElementById('btn-double');
        const btnSplit = document.getElementById('btn-split');
        const bettingArea = document.getElementById('betting-area');
        const playingArea = document.getElementById('playing-area');

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        function buildDeck() {
            deck = [];
            for (let i = 0; i < 4; i++) { // 4 decks for better playability
                for (let suit of suits) {
                    for (let value of values) {
                        deck.push({ suit, value, weight: getCardWeight(value) });
                    }
                }
            }
        }

        function shuffleDeck() {
            for (let i = deck.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * i);
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function getCardWeight(value) {
            if (['j', 'q', 'k'].includes(value)) return 10;
            if (value === 'a') return 11;
            return parseInt(value);
        }

        function calculateScore(hand) {
            let score = 0;
            let aces = 0;
            for (let card of hand) {
                score += card.weight;
                if (card.value === 'a') aces += 1;
            }
            while (score > 21 && aces > 0) {
                score -= 10;
                aces -= 1;
            }
            return score;
        }

        function updateScores(hideDealerCard = false) {
            for (let i = 0; i < playerHands.length; i++) {
                uiScoreDisplays[i].innerText = calculateScore(playerHands[i]);
            }
            if (hideDealerCard && dealerHand.length > 0) {
                uiDealerScore.innerText = dealerHand[0].weight; 
            } else {
                uiDealerScore.innerText = calculateScore(dealerHand);
            }
            uiMoney.innerText = money;
            chipAmount.innerText = bets.reduce((a, b) => a + b, 0);
        }

        function renderCardStatic(cardData, hidden = false) {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            if (hidden) {
                cardEl.classList.add('hidden');
            } else {
                cardEl.classList.add(['♥', '♦'].includes(cardData.suit) ? 'red' : 'black');
                cardEl.innerText = `${cardData.value}${cardData.suit}`;
            }
            return cardEl;
        }

        async function dealCardAnimated(targetHand, uiContainer, hidden = false, hideDealerScore = false) {
            const cardData = deck.pop();
            targetHand.push(cardData);
            
            const cardEl = renderCardStatic(cardData, hidden);
            cardEl.style.opacity = '0';
            uiContainer.appendChild(cardEl);
            
            const deckRect = deckVisual.getBoundingClientRect();
            const targetRect = cardEl.getBoundingClientRect();
            
            cardEl.style.setProperty('--startX', `${deckRect.left - targetRect.left}px`);
            cardEl.style.setProperty('--startY', `${deckRect.top - targetRect.top}px`);
            
            void cardEl.offsetWidth; // force reflow
            
            cardEl.style.opacity = '1';
            cardEl.classList.add('animating');
            
            await sleep(400); 
            updateScores(hideDealerScore);
        }

        async function revealDealerCard() {
            const hiddenEl = uiDealerHand.querySelector('.hidden');
            if (hiddenEl && dealerHand.length > 1) {
                const card = dealerHand[1];
                hiddenEl.classList.remove('hidden');
                hiddenEl.classList.add(['♥', '♦'].includes(card.suit) ? 'red' : 'black');
                hiddenEl.innerText = `${card.value}${card.suit}`;
            }
            updateScores(false);
            await sleep(400);
        }

        function toggleControls(playing) {
            bettingArea.style.display = playing ? 'none' : 'inline-block';
            playingArea.style.display = playing ? 'inline-block' : 'none';
        }

        function checkButtonStates() {
            if (!gameActive) return;
            const hand = playerHands[activeHand];
            
            btnHit.disabled = false;
            btnStand.disabled = false;
            
            // Double Down: only 2 cards, and enough money
            btnDouble.disabled = !(hand.length === 2 && money >= bets[activeHand]);
            
            // Split: 1 hand currently, 2 cards, same weight, enough money
            btnSplit.disabled = !(
                playerHands.length === 1 && 
                hand.length === 2 && 
                hand[0].weight === hand[1].weight && 
                money >= bets[0]
            );

            // Auto-stand on 21
            if (calculateScore(hand) === 21) {
                advanceHand();
            }
        }

        function setButtonsDisabled(disabled) {
            btnDeal.disabled = disabled;
            btnHit.disabled = disabled;
            btnStand.disabled = disabled;
            btnDouble.disabled = disabled;
            btnSplit.disabled = disabled;
        }

        async function advanceHand() {
            activeHand++;
            if (activeHand < playerHands.length) {
                uiWrappers[0].classList.remove('active-hand');
                uiWrappers[1].classList.add('active-hand');
                checkButtonStates();
            } else {
                uiWrappers[0].classList.remove('active-hand');
                uiWrappers[1].classList.remove('active-hand');
                await playDealerPhase();
            }
        }

        // --- Event Listeners ---

        btnDeal.addEventListener('click', async () => {
            if (isDealing) return;
            
            let bet = parseInt(betInput.value);
            if (isNaN(bet) || bet <= 0 || bet > money) {
                uiMessage.innerText = "invalid bet amount!";
                return;
            }

            isDealing = true;
            setButtonsDisabled(true);
            money -= bet;
            bets = [bet];
            playerHands = [[]];
            dealerHand = [];
            activeHand = 0;
            gameActive = true;
            
            // Reset UI
            uiHandContainers[0].innerHTML = '';
            uiHandContainers[1].innerHTML = '';
            uiWrappers[1].style.display = 'none';
            uiWrappers[0].classList.add('active-hand');
            uiWrappers[1].classList.remove('active-hand');
            uiDealerHand.innerHTML = '';
            uiDealerScore.innerText = '?';
            
            chipArea.style.visibility = 'visible';
            uiMessage.innerText = "dealing...";
            updateScores();
            
            buildDeck();
            shuffleDeck();

            await dealCardAnimated(playerHands[0], uiHandContainers[0], false, true);
            await dealCardAnimated(dealerHand, uiDealerHand, false, true);
            await dealCardAnimated(playerHands[0], uiHandContainers[0], false, true);
            await dealCardAnimated(dealerHand, uiDealerHand, true, true);

            toggleControls(true);
            isDealing = false;
            
            if (calculateScore(playerHands[0]) === 21) {
                await revealDealerCard();
                if (calculateScore(dealerHand) === 21) {
                    endGame("push. both have blackjack.", bets[0]);
                } else {
                    endGame("blackjack! you win 3:2!", bets[0] * 2.5);
                }
            } else {
                uiMessage.innerText = "your turn";
                checkButtonStates();
            }
        });

        btnHit.addEventListener('click', async () => {
            if (!gameActive || isDealing) return;
            isDealing = true;
            setButtonsDisabled(true);
            
            await dealCardAnimated(playerHands[activeHand], uiHandContainers[activeHand], false, true);
            
            if (calculateScore(playerHands[activeHand]) > 21) {
                uiMessage.innerText = playerHands.length > 1 ? `hand ${activeHand + 1} busted!` : "bust!";
                await sleep(600);
                isDealing = false;
                await advanceHand();
            } else {
                isDealing = false;
                checkButtonStates();
            }
        });

        btnStand.addEventListener('click', async () => {
            if (!gameActive || isDealing) return;
            setButtonsDisabled(true);
            await advanceHand();
        });

        btnDouble.addEventListener('click', async () => {
            if (!gameActive || isDealing) return;
            isDealing = true;
            setButtonsDisabled(true);

            money -= bets[activeHand];
            bets[activeHand] *= 2;
            updateScores(true);
            
            uiMessage.innerText = "doubling down...";
            await dealCardAnimated(playerHands[activeHand], uiHandContainers[activeHand], false, true);
            
            if (calculateScore(playerHands[activeHand]) > 21) {
                uiMessage.innerText = playerHands.length > 1 ? `hand ${activeHand + 1} busted!` : "bust!";
                await sleep(600);
            }
            
            isDealing = false;
            await advanceHand();
        });

        btnSplit.addEventListener('click', async () => {
            if (!gameActive || isDealing) return;
            isDealing = true;
            setButtonsDisabled(true);

            money -= bets[0];
            bets.push(bets[0]);
            
            // Move one card to the second hand array
            let splitCard = playerHands[0].pop();
            playerHands.push([splitCard]);
            
            // Adjust the DOM instantly for the split
            uiHandContainers[0].innerHTML = '';
            uiHandContainers[0].appendChild(renderCardStatic(playerHands[0][0]));
            
            uiWrappers[1].style.display = 'block';
            uiHandContainers[1].innerHTML = '';
            uiHandContainers[1].appendChild(renderCardStatic(playerHands[1][0]));
            
            updateScores(true);
            uiMessage.innerText = "splitting pairs...";
            await sleep(300);

            // Deal second card to each hand
            await dealCardAnimated(playerHands[0], uiHandContainers[0], false, true);
            await dealCardAnimated(playerHands[1], uiHandContainers[1], false, true);

            isDealing = false;

            // Special rule: Split Aces only get 1 card and automatically stand
            if (playerHands[0][0].value === 'a') {
                uiMessage.innerText = "split aces: one card only.";
                await sleep(1000);
                await advanceHand();
                await advanceHand();
            } else {
                uiMessage.innerText = "playing hand 1";
                checkButtonStates();
            }
        });

        async function playDealerPhase() {
            gameActive = false;
            isDealing = true;
            
            // Check if all hands busted
            let allBusted = playerHands.every(hand => calculateScore(hand) > 21);
            
            await revealDealerCard();
            
            if (!allBusted) {
                uiMessage.innerText = "dealer's turn...";
                await sleep(500);
                let dealerScore = calculateScore(dealerHand);
                while (dealerScore < 17) {
                    await dealCardAnimated(dealerHand, uiDealerHand, false, false);
                    dealerScore = calculateScore(dealerHand);
                }
            }
            
            calculatePayouts();
        }

        function calculatePayouts() {
            let totalPayout = 0;
            let dealerScore = calculateScore(dealerHand);
            let dealerBusted = dealerScore > 21;
            let finalMsg = "";

            for (let i = 0; i < playerHands.length; i++) {
                let pScore = calculateScore(playerHands[i]);
                let bet = bets[i];
                let prefix = playerHands.length > 1 ? `h${i + 1}: ` : "";

                if (pScore > 21) {
                    finalMsg += `${prefix}bust. `;
                } else if (dealerBusted) {
                    finalMsg += `${prefix}win. `;
                    totalPayout += bet * 2;
                } else if (pScore > dealerScore) {
                    finalMsg += `${prefix}win. `;
                    totalPayout += bet * 2;
                } else if (dealerScore > pScore) {
                    finalMsg += `${prefix}lose. `;
                } else {
                    finalMsg += `${prefix}push. `;
                    totalPayout += bet;
                }
            }

            endGame(finalMsg, totalPayout);
        }

        function endGame(msg, payout) {
            gameActive = false;
            isDealing = false;
            money += payout;
            uiMessage.innerText = msg;
            updateScores(false);
            toggleControls(false);
            setButtonsDisabled(false);
            chipArea.style.visibility = 'hidden';
            
            if (money <= 0) {
                uiMessage.innerText = "you're out of money! refresh to restart.";
                btnDeal.disabled = true;
                betInput.disabled = true;
            }
        }
    </script>
</body>
</html>
